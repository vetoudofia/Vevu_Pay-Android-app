name: VevuPay Android APK and AAB

on:
  push:
    branches: [android-build]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure public app environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_APP_VERSION: ${{ vars.VEVUPAY_APP_VERSION || '1.0.0' }}
          VITE_APP_VERSION_CODE: ${{ vars.VEVUPAY_APP_VERSION_CODE || '1' }}
          VITE_DISTRIBUTION_CHANNEL: ${{ vars.VEVUPAY_DISTRIBUTION_CHANNEL || 'direct' }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in repository Actions secrets."
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_PAYSTACK_PUBLIC_KEY=$VITE_PAYSTACK_PUBLIC_KEY"
            echo "VITE_APP_VERSION=$VITE_APP_VERSION"
            echo "VITE_APP_VERSION_CODE=$VITE_APP_VERSION_CODE"
            echo "VITE_DISTRIBUTION_CHANNEL=$VITE_DISTRIBUTION_CHANNEL"
          } > .env.production.local

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build mobile web application
        run: npm run build:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Generate launcher and splash assets
        run: npx capacitor-assets generate --android

      - name: Install VevuPay native Android integration
        run: npm run android:prepare

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Directly distributed APKs must use the app-signing key.
      - name: Configure direct APK app-signing key
        env:
          VEVUPAY_ANDROID_KEYSTORE_BASE64: ${{ secrets.VEVUPAY_ANDROID_APP_KEYSTORE_BASE64 }}
          VEVUPAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VEVUPAY_ANDROID_APP_KEYSTORE_PASSWORD }}
        run: node scripts/configure-android-signing.mjs app

      - name: Build signed direct APK
        working-directory: android
        run: ./gradlew assembleRelease

      # Google Play AABs must use the separate upload key.
      - name: Configure Google Play upload key
        env:
          VEVUPAY_ANDROID_KEYSTORE_BASE64: ${{ secrets.VEVUPAY_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          VEVUPAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VEVUPAY_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: node scripts/configure-android-signing.mjs upload

      - name: Build signed Google Play AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vevupay-android-signed-apk-aab
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
